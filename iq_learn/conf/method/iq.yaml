# @package _global_

method:
  type: iq
  loss: value

  constrain: False
  grad_pen: False
  chi: False
  tanh: False
  regularize: False
  div:

  alpha: 0.05
  # Scaling for DICE loss / weighted-BC dice reward (iq.loss=dice, constrain+dice, DiceAgent BC).
  # Falls back to `alpha` if omitted (backward compatible).
  dice_alpha: 0.1
  # Clip weighted-BC importance weights before re-normalizing them.
  bc_weight_clip: 20.0
  # Reuse the previous eval-time BC policy as initialization for the next eval,
  # so offline weighted BC refines instead of restarting every eval.
  bc_warm_start_eval: true
  # Estimate BC-weight statistics from random offline batches at every eval.
  bc_weight_eval_batches: 16
  # If <= 0, reuse `bc_batch`.
  bc_weight_eval_batch: 0
  # Log sampled weight/reward histograms to TensorBoard/W&B.
  bc_weight_eval_hist: true
  lambda_gp: 10
  mix_coeff: 1

  # Continuous CQL settings (used by agent=cql)
  cql_alpha: 1.0
  cql_n_actions: 10

  # Keep legacy IQ path by default. Set true to run pure offline CQL updates.
  offline_pure_cql: false

  # For offline continuous dice, force the base agent and training backend to use
  # the CQL critic path instead of the IQ critic path.
  dice_use_cql_q: false

  # Only for offline + dice: parameterize the IQ/DICE reward term directly
  # with the critic architecture instead of learning Q first.
  normal_r: false

  # Transition-ensemble disagreement penalty.
  # When penalty=true, k transition networks are initialised and trained on
  # online_memory_replay; the penalty pen(s,a) = max_{i,j} |g_i(s,a)-g_j(s,a)|
  # is subtracted (scaled by lambda_penalty) from the IQ reward on expert data.
  penalty: false
  ensemble_k: 10
  lambda_penalty: 1.0